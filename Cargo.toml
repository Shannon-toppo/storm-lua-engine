[workspace]
resolver = "2"
members = [
    "crates/storm-lua-spec", "crates/storm-screen-raster", "crates/storm-lua-vm",
    "crates/storm-lua-microcontroller", "crates/storm-lua-wasm", "crates/storm-screen-wasm",
    "conformance", "xtask", "crates/storm-lua-bridge", "crates/storm-lua-addon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Stormcat-Works/storm-lua-engine"
publish = false

[workspace.dependencies]
storm-lua-addon = { path = "crates/storm-lua-addon", default-features = false }
storm-lua-bridge = { path = "crates/storm-lua-bridge" }
storm-lua-spec = { path = "crates/storm-lua-spec" }
storm-screen-raster = { path = "crates/storm-screen-raster" }
storm-lua-vm = { path = "crates/storm-lua-vm", default-features = false }
storm-lua-microcontroller = { path = "crates/storm-lua-microcontroller", default-features = false }
# Keep backend migration separate from extraction. No LuaJIT, Luau, async or send feature.
mlua = { version = "=0.10.5", default-features = false, features = ["lua53", "vendored"] }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Do not force panic=abort across an embedded mlua runtime.
